name: Feature request
description: Suggest an improvement or a new capability for Godot Hub.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for sharing your idea.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the workflow or limitation behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you would like Godot Hub to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Share workarounds, mockups, screenshots, or related ideas.
